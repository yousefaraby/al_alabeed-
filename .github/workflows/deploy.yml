name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and deploy via FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build (static export)
        # set these under Settings → Secrets and variables → Actions → Variables
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
          NEXT_PUBLIC_BING_SITE_VERIFICATION: ${{ vars.NEXT_PUBLIC_BING_SITE_VERIFICATION }}
        run: npm run build

      - name: Deploy to Hostinger reliably
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PWD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          lftp -c "
          set ssl:verify-certificate no
          set ftp:ssl-allow yes
          set net:timeout 10
          set net:max-retries 5
          open -u \"$FTP_USER\",\"$FTP_PWD\" \"$FTP_SERVER\"
          mirror -Rnv ./out/ ./ --parallel=1 --exclude-glob .htaccess
          "