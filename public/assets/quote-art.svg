<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="paper" x1="40" y1="30" x2="150" y2="170" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#C9D6F2"/>
    </linearGradient>
    <linearGradient id="fold" x1="118" y1="26" x2="146" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E9EFFB"/><stop offset="1" stop-color="#A9BBE3"/>
    </linearGradient>
    <linearGradient id="coin" x1="14" y1="110" x2="74" y2="170" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD05A"/><stop offset="1" stop-color="#F59A07"/>
    </linearGradient>
    <linearGradient id="calc" x1="110" y1="108" x2="190" y2="208" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3C5FC4"/><stop offset="1" stop-color="#16276F"/>
    </linearGradient>
    <linearGradient id="screen" x1="125" y1="124" x2="178" y2="140" gradientUnits="userSpaceOnUse">
      <stop stop-color="#BBD2FF"/><stop offset="1" stop-color="#7FA4F2"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#050A2A" flood-opacity=".5"/>
    </filter>
  </defs>

  <!-- rays -->
  <g stroke="#FFC233" stroke-width="7" stroke-linecap="round">
    <path d="M24 44 42 54"/>
    <path d="M46 16 56 40"/>
    <path d="M76 8 74 32"/>
  </g>

  <!-- document -->
  <g filter="url(#soft)" transform="rotate(-6 95 95)">
    <path d="M42 34a12 12 0 0 1 12-12h66l30 30v100a12 12 0 0 1-12 12H54a12 12 0 0 1-12-12V34Z" fill="url(#paper)"/>
    <path d="M120 22v18a12 12 0 0 0 12 12h18L120 22Z" fill="url(#fold)"/>
    <g stroke="#1E3A9E" stroke-width="6" stroke-linecap="round">
      <path d="M64 52h40"/>
      <path d="M64 74h66"/>
      <path d="M64 94h56"/>
      <path d="M64 114h44"/>
    </g>
  </g>

  <!-- percent coin -->
  <g filter="url(#soft)">
    <circle cx="48" cy="142" r="30" fill="url(#coin)"/>
    <circle cx="48" cy="142" r="23" stroke="#FFE6A3" stroke-opacity=".55" stroke-width="2"/>
    <g stroke="#FFFFFF" stroke-width="5" stroke-linecap="round">
      <path d="M60 128 36 156"/>
    </g>
    <circle cx="38" cy="131" r="6" stroke="#FFFFFF" stroke-width="4.5"/>
    <circle cx="58" cy="153" r="6" stroke="#FFFFFF" stroke-width="4.5"/>
  </g>

  <!-- calculator -->
  <g filter="url(#soft)" transform="rotate(10 150 158)">
    <rect x="108" y="104" width="86" height="106" rx="11" fill="url(#calc)"/>
    <rect x="108.75" y="104.75" width="84.5" height="104.5" rx="10.25" stroke="#7E9BE8" stroke-opacity=".5" stroke-width="1.5"/>
    <rect x="119" y="115" width="64" height="22" rx="4" fill="url(#screen)"/>
    <g fill="#DCE6FF">
      <rect x="119" y="145" width="17" height="13" rx="3"/>
      <rect x="142.5" y="145" width="17" height="13" rx="3"/>
      <rect x="166" y="145" width="17" height="13" rx="3"/>
      <rect x="119" y="164" width="17" height="13" rx="3"/>
      <rect x="142.5" y="164" width="17" height="13" rx="3"/>
      <rect x="166" y="164" width="17" height="13" rx="3"/>
      <rect x="119" y="183" width="17" height="13" rx="3"/>
      <rect x="142.5" y="183" width="17" height="13" rx="3"/>
    </g>
    <rect x="166" y="183" width="17" height="13" rx="3" fill="#FFC233"/>
  </g>
</svg>
